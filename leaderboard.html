<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BING BING RHYTHM WAR — Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#02040f;
    --bg-mid:#070d24;
    --violet:#6f7bff;
    --violet-dim:#3a4a9f;
    --violet-soft:#8fa6ff;
    --cyan:#5ee9f0;
    --panel-brd:rgba(126,152,240,.40);
    --panel-bg:rgba(96,128,210,.055);
    --panel-bg-hi:rgba(120,155,235,.11);
    --ink:#e6ecff;
    --ink-dim:#8ea0cc;
  }
  *{box-sizing:border-box;margin:0;padding:0}

  body{
    min-height:100vh;
    font-family:'Share Tech Mono',ui-monospace,'Cascadia Mono','Courier New',monospace;
    color:var(--ink);
    background:
      radial-gradient(ellipse 130% 70% at 50% -12%, #113a7a 0%, transparent 58%),
      radial-gradient(ellipse 80% 50% at 12% 8%, #0d5f78 0%, transparent 52%),
      radial-gradient(ellipse 95% 60% at 82% 96%, #3b2a8c 0%, transparent 55%),
      radial-gradient(ellipse 70% 45% at 40% 108%, #0a4a72 0%, transparent 50%),
      linear-gradient(180deg,var(--bg-mid) 0%,var(--bg-deep) 62%,#01020a 100%);
    background-attachment:fixed;
    position:relative;
    overflow-x:hidden;
  }

  /* perspective grid + scanlines: the retro layer */
  /* slow-drifting grid, cyan-leaning */
  body::before{
    content:'';position:fixed;inset:-60px;pointer-events:none;z-index:0;
    background-image:
      linear-gradient(rgba(88,170,255,.13) 1px,transparent 1px),
      linear-gradient(90deg,rgba(88,170,255,.13) 1px,transparent 1px);
    background-size:46px 46px;
    mask-image:radial-gradient(ellipse 82% 68% at 50% 38%,#000 22%,transparent 76%);
    -webkit-mask-image:radial-gradient(ellipse 82% 68% at 50% 38%,#000 22%,transparent 76%);
    animation:drift 14s linear infinite;
  }
  @keyframes drift{from{background-position:0 0}to{background-position:0 46px}}

  /* horizon glow across the lower third */
  .horizon{
    position:fixed;left:-10%;right:-10%;bottom:16%;height:1px;z-index:1;
    pointer-events:none;
    background:linear-gradient(90deg,transparent,rgba(110,220,255,.55),rgba(150,140,255,.5),transparent);
    box-shadow:0 0 34px 7px rgba(70,160,255,.20);
    opacity:.75;
  }
  body::after{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:60;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.20) 0 1px,transparent 1px 3px);
    opacity:.42;
  }

  .wrap{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:34px 20px 70px}

  /* ---------- header ---------- */
  header{position:relative;display:flex;align-items:center;justify-content:center;
         min-height:74px;margin-bottom:8px}
  h1{
    font-family:'Orbitron','Share Tech Mono',monospace;
    font-weight:900;font-size:clamp(26px,5.2vw,46px);
    letter-spacing:.16em;text-align:center;
    background:linear-gradient(180deg,#fff 0%,#a9d8ff 48%,#7d8ce0 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 16px rgba(90,170,255,.55));
  }
  .sub{
    text-align:center;color:var(--ink-dim);font-size:12px;letter-spacing:.32em;
    margin-top:-2px;margin-bottom:26px;text-transform:uppercase;
  }
  #addBtn{
    position:absolute;right:0;top:50%;transform:translateY(-50%);
    font-family:'Orbitron',monospace;font-weight:700;font-size:12px;letter-spacing:.14em;
    color:var(--ink);cursor:pointer;
    padding:11px 17px;border-radius:11px;
    border:1px solid var(--panel-brd);
    background:linear-gradient(180deg,rgba(110,150,235,.24),rgba(80,110,190,.10));
    box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 4px 18px rgba(70,40,150,.35);
    transition:.18s;
  }
  #addBtn:hover{
    border-color:var(--violet-soft);
    background:linear-gradient(180deg,rgba(120,180,255,.40),rgba(90,120,205,.20));
    box-shadow:0 0 22px rgba(90,170,255,.45);transform:translateY(-50%) translateY(-1px);
  }

  /* ---------- column labels ---------- */
  .cols{
    display:grid;grid-template-columns:52px 1fr 132px 92px;gap:14px;
    padding:0 18px 9px;font-size:10.5px;letter-spacing:.24em;color:var(--ink-dim);
    text-transform:uppercase;
  }
  .cols span:nth-child(3){text-align:right}
  .cols span:nth-child(4){text-align:center}

  /* ---------- rows ---------- */
  .row{
    display:grid;grid-template-columns:52px 1fr 132px 92px;gap:14px;align-items:center;
    padding:15px 18px;margin-bottom:11px;border-radius:14px;
    border:1px solid var(--panel-brd);
    background:linear-gradient(180deg,var(--panel-bg-hi),var(--panel-bg));
    backdrop-filter:blur(9px) saturate(115%);
    -webkit-backdrop-filter:blur(9px) saturate(115%);
    box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,0 3px 20px rgba(4,12,40,.42);
    animation:slideIn .32s cubic-bezier(.22,1,.36,1) backwards;
    position:relative;
  }
  @keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .row:hover{border-color:rgba(150,190,255,.72);background:linear-gradient(180deg,rgba(130,170,240,.16),rgba(96,128,210,.085))}
  .row:hover .del{opacity:1}

  .rank{
    font-family:'Orbitron',monospace;font-weight:700;font-size:17px;
    color:var(--ink-dim);text-align:center;
  }
  .row.top1 .rank{color:#ffd86b;text-shadow:0 0 12px rgba(255,200,80,.6)}
  .row.top2 .rank{color:#d8d8ef;text-shadow:0 0 10px rgba(200,200,240,.45)}
  .row.top3 .rank{color:#e0a173;text-shadow:0 0 10px rgba(224,150,100,.45)}
  .row.top1{border-color:rgba(255,205,110,.42)}

  .name{
    font-family:'Orbitron',monospace;font-weight:500;font-size:16px;
    letter-spacing:.05em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .score{
    font-size:19px;text-align:right;letter-spacing:.06em;
    color:#fff;text-shadow:0 0 10px rgba(110,190,255,.5);
  }

  .grade{
    justify-self:center;min-width:66px;text-align:center;
    font-family:'Orbitron',monospace;font-weight:900;font-size:15px;letter-spacing:.06em;
    padding:6px 10px;border-radius:9px;
    border:1px solid currentColor;
    background:rgba(255,255,255,.05);
  }

  .del{
    position:absolute;right:-9px;top:-9px;width:22px;height:22px;border-radius:50%;
    border:1px solid rgba(255,120,150,.55);background:#1b0f24;color:#ff8fa8;
    font-size:13px;line-height:1;cursor:pointer;opacity:0;transition:.15s;
  }
  .del:hover{background:#37121f}

  /* ---------- empty / loading ---------- */
  .msg{
    text-align:center;color:var(--ink-dim);padding:52px 20px;font-size:13px;
    letter-spacing:.16em;border:1px dashed var(--panel-brd);border-radius:14px;
    background:rgba(96,84,150,.07);
  }

  /* ---------- modal ---------- */
  .veil{
    position:fixed;inset:0;z-index:80;display:none;
    align-items:center;justify-content:center;padding:20px;
    background:rgba(5,3,16,.78);backdrop-filter:blur(5px);
  }
  .veil.on{display:flex}
  .card{
    width:100%;max-width:400px;border-radius:16px;padding:26px;
    border:1px solid var(--panel-brd);
    background:linear-gradient(180deg,#0e1740,#060a1e);
    box-shadow:0 0 48px rgba(40,110,210,.42);
    animation:pop .24s cubic-bezier(.22,1,.36,1);
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .card h2{
    font-family:'Orbitron',monospace;font-size:16px;font-weight:700;letter-spacing:.16em;
    margin-bottom:20px;text-align:center;color:var(--violet-soft);
  }
  label{display:block;font-size:10.5px;letter-spacing:.22em;color:var(--ink-dim);
        margin:0 0 6px;text-transform:uppercase}
  input,select{
    width:100%;padding:11px 13px;margin-bottom:15px;border-radius:10px;
    border:1px solid var(--panel-brd);background:rgba(10,6,26,.85);color:var(--ink);
    font-family:'Share Tech Mono',monospace;font-size:15px;outline:none;
  }
  input:focus,select:focus{border-color:var(--violet-soft);box-shadow:0 0 14px rgba(130,100,255,.32)}
  select option{background:#140e2e}
  .hint{font-size:11px;color:var(--ink-dim);margin:-9px 0 15px;letter-spacing:.04em}
  .btns{display:flex;gap:10px;margin-top:4px}
  .btns button{
    flex:1;padding:12px;border-radius:10px;cursor:pointer;
    font-family:'Orbitron',monospace;font-weight:700;font-size:12px;letter-spacing:.12em;
    border:1px solid var(--panel-brd);background:rgba(96,84,150,.16);color:var(--ink);
    transition:.16s;
  }
  .btns .go{background:linear-gradient(180deg,rgba(150,120,255,.5),rgba(100,80,190,.3));
            border-color:var(--violet-soft)}
  .btns button:hover{filter:brightness(1.25)}
  .err{color:#ff8fa8;font-size:11.5px;min-height:15px;letter-spacing:.05em;margin-bottom:8px}

  @media(max-width:620px){
    header{flex-direction:column;align-items:center;min-height:auto}
    #addBtn{position:static;transform:none;margin-top:14px}
    #addBtn:hover{transform:translateY(-1px)}
    .cols,.row{grid-template-columns:36px 1fr 96px 62px;gap:9px;padding-left:12px;padding-right:12px}
    .score{font-size:15px}.name{font-size:14px}.grade{font-size:12px;min-width:52px;padding:5px 6px}
  }
</style>
</head>
<body>
<div class="horizon"></div>
<div class="wrap">
  <header>
    <div>
      <h1>LEADERBOARD</h1>
    </div>
    <button id="addBtn">+ NEW PLAYER</button>
  </header>
  <div class="sub">Bing Bing Rhythm War</div>

  <div class="cols"><span>Rank</span><span>Player</span><span>Score</span><span>Rating</span></div>
  <div id="list"><div class="msg">LOADING…</div></div>
</div>

<div class="veil" id="veil">
  <div class="card">
    <h2>NEW ENTRY</h2>
    <div class="err" id="err"></div>
    <label for="nick">Nickname</label>
    <input id="nick" maxlength="18" placeholder="PLAYER1" autocomplete="off">
    <label for="scoreIn">Score</label>
    <input id="scoreIn" inputmode="numeric" placeholder="0" autocomplete="off">
    <div class="hint">Out of 1,000,000 — rating fills in automatically.</div>
    <label for="gradeIn">Rating</label>
    <select id="gradeIn"></select>
    <div class="btns">
      <button id="cancelBtn">CANCEL</button>
      <button id="saveBtn" class="go">ADD</button>
    </div>
  </div>
</div>

<script>
const MAX = 1000000;

// Cutoffs and colours mirror the game's own grading, so the board agrees with
// what players see on their results screen.
const GRADES = [
  {k:'SS+', min:0.99, a:'#ff6ac6', b:'#a06aff'},
  {k:'SS',  min:0.98, a:'#c77dff', b:'#7aa2ff'},
  {k:'S',   min:0.95, a:'#7aa2ff', b:'#66e8e8'},
  {k:'A',   min:0.92, a:'#5fdcef', b:'#7ff0c0'},
  {k:'B',   min:0.89, a:'#8fa8f0', b:'#b79cff'},
  {k:'C',   min:0.86, a:'#b799dc', b:'#dc95d2'},
  {k:'D',   min:0.70, a:'#e089bd', b:'#c877b8'},
  {k:'F',   min:0.00, a:'#f05a72', b:'#cc4d85'},
];
const gradeFor = s => GRADES.find(g => s / MAX >= g.min) || GRADES[GRADES.length - 1];
const gradeMeta = k => GRADES.find(g => g.k === k) || GRADES[GRADES.length - 1];

const KEY = 'rhythm-leaderboard-v1';
let rows = [];

const $ = id => document.getElementById(id);
const listEl = $('list'), veil = $('veil'), errEl = $('err');

GRADES.forEach(g => {
  const o = document.createElement('option');
  o.value = g.k; o.textContent = g.k;
  $('gradeIn').appendChild(o);
});

const fmt = n => n.toString().padStart(7, '0').replace(/\B(?=(\d{3})+(?!\d))/g, "'");

function render(){
  if (!rows.length){
    listEl.innerHTML = '<div class="msg">NO SCORES YET — ADD THE FIRST ONE</div>';
    return;
  }
  const sorted = [...rows].sort((x, y) => y.score - x.score);
  listEl.innerHTML = '';
  sorted.forEach((r, i) => {
    const g = gradeMeta(r.grade);
    const el = document.createElement('div');
    el.className = 'row' + (i < 3 ? ' top' + (i + 1) : '');
    el.style.animationDelay = (i * 38) + 'ms';
    el.innerHTML =
      '<div class="rank">' + (i + 1) + '</div>' +
      '<div class="name"></div>' +
      '<div class="score">' + fmt(r.score) + '</div>' +
      '<div class="grade" style="color:' + g.a +
        ';background:linear-gradient(135deg,' + g.a + '22,' + g.b + '22)">' + r.grade + '</div>' +
      '<button class="del" title="remove">×</button>';
    el.querySelector('.name').textContent = r.name;   // textContent: no HTML injection
    el.querySelector('.del').onclick = () => remove(r.id);
    listEl.appendChild(el);
  });
}

async function load(){
  try {
    const res = await window.storage.get(KEY, true);
    rows = res && res.value ? JSON.parse(res.value) : [];
  } catch (e) {
    rows = [];                       // missing key throws; that just means empty
  }
  render();
}

async function save(){
  try {
    await window.storage.set(KEY, JSON.stringify(rows), true);
  } catch (e) {
    console.error('save failed', e);
    errEl.textContent = 'COULD NOT SAVE — TRY AGAIN';
  }
}

async function remove(id){
  rows = rows.filter(r => r.id !== id);
  render();
  await save();
}

function openModal(){
  errEl.textContent = '';
  $('nick').value = ''; $('scoreIn').value = '';
  $('gradeIn').value = gradeFor(0).k;
  veil.classList.add('on');
  $('nick').focus();
}
const closeModal = () => veil.classList.remove('on');

// keep the rating in step with the score as it is typed
$('scoreIn').addEventListener('input', e => {
  const digits = e.target.value.replace(/[^\d]/g, '');
  e.target.value = digits;
  if (digits) $('gradeIn').value = gradeFor(Math.min(parseInt(digits, 10), MAX)).k;
});

async function submit(){
  const name = $('nick').value.trim();
  const raw  = $('scoreIn').value.replace(/[^\d]/g, '');
  if (!name){ errEl.textContent = 'ENTER A NICKNAME'; return; }
  if (!raw){ errEl.textContent = 'ENTER A SCORE'; return; }
  let score = parseInt(raw, 10);
  if (score > MAX){ errEl.textContent = 'MAX SCORE IS 1,000,000'; return; }
  rows.push({ id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
              name, score, grade: $('gradeIn').value });
  closeModal();
  render();
  await save();
}

$('addBtn').onclick = openModal;
$('cancelBtn').onclick = closeModal;
$('saveBtn').onclick = submit;
veil.onclick = e => { if (e.target === veil) closeModal(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && veil.classList.contains('on')) submit();
});

load();
</script>
</body>
</html>
